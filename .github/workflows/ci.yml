name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: go vet (conformance build tag)
        run: go vet -tags conformance .
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: |
          helm lint --strict deploy/cert-manager-webhook-hostinger
          helm lint --strict deploy/cert-manager-webhook-hostinger \
            --set networkPolicy.enabled=true --set serviceMonitor.enabled=true \
            --set podDisruptionBudget.enabled=true --set 'secretAccess.namespaces={apps}'
      - name: shellcheck
        run: shellcheck test/e2e/run.sh hack/*.sh

  test:
    name: Unit + conformance tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      # cert-manager's DNS01 webhook conformance suite in strict mode, against
      # the in-memory Hostinger API and DNS server.
      - name: Conformance tests
        run: make test-conformance

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  image:
    name: Image build + scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify base image provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/verify-base-images.sh Dockerfile test/e2e/Dockerfile.fake
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: cert-manager-webhook-hostinger:ci
          cache-from: type=gha
      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: cert-manager-webhook-hostinger:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  e2e:
    name: E2E (kind, k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Kubernetes minors supported by cert-manager.
        include:
          - k8s: "1.31"
            node: kindest/node:v1.31.14
          - k8s: "1.35"
            node: kindest/node:v1.35.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      # Certificate (apex + wildcard) and Gateway issuance via Pebble, then
      # automatic renewal of both, then TXT cleanup.
      - name: Run e2e
        env:
          KIND_NODE_IMAGE: ${{ matrix.node }}
        run: test/e2e/run.sh
