# Trusted builder for the container image (SLSA Build Level 3).
#
# Building and attesting inside a reusable workflow isolates the signing
# identity from the calling workflow: the provenance is signed with this
# workflow's OIDC identity, so consumers can require it explicitly:
#
#   gh attestation verify oci://ghcr.io/taha2samy-3/cert-manager-webhook-hostinger:<tag> \
#     --owner taha2samy-3 \
#     --signer-workflow taha2samy-3/cert-manager-webhook-hostinger/.github/workflows/build-image.yml
name: Build image (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: Release tag to build, e.g. v1.2.3
        required: true
        type: string
    outputs:
      image:
        description: Image repository
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Image index digest
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Validate version
        id: vars
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid version $VERSION"; exit 1; }
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Verify base image provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/verify-base-images.sh Dockerfile

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=cert-manager-webhook-hostinger
            org.opencontainers.image.description=cert-manager ACME DNS01 webhook for Hostinger DNS
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ inputs.version }}
          # Provenance and SBOM are produced as signed GitHub attestations below.
          provenance: false
          sbom: false

      - name: Attest build provenance (SLSA v1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (cosign keyless)
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Scan pushed image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - name: Summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo '```sh'
            echo "gh attestation verify oci://$IMAGE@$DIGEST --owner ${GITHUB_REPOSITORY_OWNER} \\"
            echo "  --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/build-image.yml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
