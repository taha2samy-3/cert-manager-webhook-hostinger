# Enables auto-merge on Dependabot PRs for patch, minor and digest updates.
# GitHub merges them only after the required status checks pass, so this needs
# "Allow auto-merge" and branch protection with required checks on main.
# Major updates are left for review.
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository_owner == 'taha2samy-3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
