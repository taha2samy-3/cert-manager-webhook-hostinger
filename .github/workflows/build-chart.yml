# Trusted builder for the Helm chart (SLSA Build Level 3), see build-image.yml.
# The packaged chart pins the image by digest, so a chart version always
# deploys exactly the image that was attested with it.
#
#   gh attestation verify oci://ghcr.io/taha2samy-3/charts/cert-manager-webhook-hostinger:<version> \
#     --owner taha2samy-3 \
#     --signer-workflow taha2samy-3/cert-manager-webhook-hostinger/.github/workflows/build-chart.yml
name: Build chart (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: Release tag, e.g. v1.2.3
        required: true
        type: string
      image-digest:
        description: Digest of the image built for this release
        required: true
        type: string
    secrets:
      ARTIFACTHUB_API_KEY_ID:
        required: false
      ARTIFACTHUB_API_KEY_SECRET:
        required: false
    outputs:
      chart:
        description: OCI reference of the chart
        value: ${{ jobs.build.outputs.chart }}
      digest:
        description: Chart digest
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

env:
  CHART_DIR: deploy/cert-manager-webhook-hostinger
  CHART_NAME: cert-manager-webhook-hostinger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      chart: ${{ steps.push.outputs.chart }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Docker credentials are what attest-build-provenance (push-to-registry),
      # cosign and oras read; helm keeps its own login below.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set chart version, image digest and ArtifactHub metadata
        env:
          TAG: ${{ inputs.version }}
          DIGEST: ${{ inputs.image-digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::invalid digest $DIGEST"; exit 1; }
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"

          # Changelog for ArtifactHub from commit subjects since the previous tag.
          changes="$(git log --format='%s' ${prev:+"$prev..$TAG"} -- . ':!.github' | head -30 |
            sed -E 's/"/\\"/g; s/^(.*)$/- kind: changed\n  description: "\1"/')"
          [[ -n "$changes" ]] || changes=$'- kind: changed\n  description: "Rebuild with updated dependencies"'

          export version image changes
          yq -i '
            .version = strenv(version) |
            .appVersion = strenv(version) |
            .annotations["artifacthub.io/images"] = "- name: cert-manager-webhook-hostinger\n  image: " + strenv(image) + ":" + strenv(version) + "\n  platforms:\n    - linux/amd64\n    - linux/arm64\n" |
            .annotations["artifacthub.io/changes"] = strenv(changes) + "\n" |
            .annotations["artifacthub.io/prerelease"] = (strenv(version) | test("-") | tostring)
          ' "$CHART_DIR/Chart.yaml"
          if [[ "$(git log -1 --format=%s "$TAG")" == *"security"* ]]; then
            yq -i '.annotations["artifacthub.io/containsSecurityUpdates"] = "true"' "$CHART_DIR/Chart.yaml"
          fi
          # Pin the exact image built for this release; the tag is informational.
          yq -i '.image.digest = strenv(DIGEST) | .image.tag = strenv(version)' "$CHART_DIR/values.yaml"
          cat "$CHART_DIR/Chart.yaml"

      - name: Lint and package
        run: |
          # ArtifactHub renders the README packaged inside the chart.
          cp README.md "$CHART_DIR/README.md"
          helm lint --strict "$CHART_DIR"
          helm package "$CHART_DIR" --destination dist

      - name: Push to GHCR
        id: push
        env:
          TAG: ${{ inputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          out="$(helm push "dist/${CHART_NAME}-${TAG#v}.tgz" "oci://$repo" 2>&1)"
          echo "$out"
          digest="$(sed -nE 's/^Digest: (sha256:[a-f0-9]{64})$/\1/p' <<<"$out")"
          [[ -n "$digest" ]] || { echo "::error::could not read chart digest"; exit 1; }
          echo "chart=$repo/$CHART_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest chart provenance (SLSA v1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest chart archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart (cosign keyless)
        env:
          REF: ${{ steps.push.outputs.chart }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      # ArtifactHub reads repository metadata (ownership, verified publisher)
      # from the "artifacthub.io" tag of the OCI repository. With an API key,
      # the repository is registered on ArtifactHub if missing and its ID is
      # filled in automatically.
      - name: Register on ArtifactHub
        env:
          CHART: ${{ steps.push.outputs.chart }}
          AH_KEY_ID: ${{ secrets.ARTIFACTHUB_API_KEY_ID }}
          AH_KEY_SECRET: ${{ secrets.ARTIFACTHUB_API_KEY_SECRET }}
        run: |
          if [[ -z "$AH_KEY_ID" || -z "$AH_KEY_SECRET" ]]; then
            echo "::notice::ArtifactHub API key not configured; using repositoryID from artifacthub-repo.yml"
            exit 0
          fi
          api=https://artifacthub.io/api/v1
          url="oci://$CHART"
          hdr=(-H "X-API-KEY-ID: $AH_KEY_ID" -H "X-API-KEY-SECRET: $AH_KEY_SECRET")
          alias="$(curl -fsS "${hdr[@]}" "$api/users/profile" | jq -r .alias)"
          find_id() {
            curl -fsS "${hdr[@]}" "$api/repositories/search?user=$alias&name=cert-manager-webhook-hostinger&limit=60" |
              jq -r --arg url "$url" '[.[] | select(.url == $url) | .repository_id][0] // empty'
          }
          id="$(find_id)"
          if [[ -z "$id" ]]; then
            echo "Registering $url on ArtifactHub"
            jq -n --arg url "$url" '{kind: 0, name: "cert-manager-webhook-hostinger",
                display_name: "cert-manager webhook for Hostinger", url: $url}' |
              curl -fsS "${hdr[@]}" -H 'Content-Type: application/json' -X POST "$api/repositories/user" --data-binary @-
            id="$(find_id)"
          fi
          [[ -n "$id" ]] || { echo "::error::could not resolve the ArtifactHub repository ID"; exit 1; }
          export id
          yq -i '.repositoryID = strenv(id)' artifacthub-repo.yml
          echo "ArtifactHub repository ID: $id"

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Push ArtifactHub repository metadata
        env:
          CHART: ${{ steps.push.outputs.chart }}
        run: |
          oras push "$CHART:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error
